      required: true
      selector:
        number:
          min: 1
          max: 20000
          step: 1
          unit_of_measurement: L
          mode: box
    price:
      required: true
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          unit_of_measurement: DKK
          mode: box
